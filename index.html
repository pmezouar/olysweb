<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>OlysWeb - Solutions web sur mesure pour professionnels</title>
    <meta
      name="description"
      content="OlysWeb conçoit et développe des solutions web sur mesure pour les professionnels : sites web, applications métier, plateformes, e-commerce et automatisations."
    />

    <meta
      name="keywords"
      content="agence web, développement web, développement sur mesure, site internet, application web, application métier, plateforme web, e-commerce, automatisation, agence digitale, développeur web, OlysWeb"
    />

    <meta name="author" content="OlysWeb" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.OlysWeb.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OlysWeb" />
    <meta
      property="og:title"
      content="OlysWeb — Solutions web sur mesure pour professionnels"
    />
    <meta
      property="og:description"
      content="Nous concevons et développons des solutions web sur mesure pensées pour répondre aux enjeux réels de votre entreprise."
    />
    <meta property="og:url" content="https://www.OlysWeb.com" />

    <meta property="og:image" content="https://www.OlysWeb.com/og-image.png" />
    <meta
      property="og:image:alt"
      content="OlysWeb — Solutions web sur mesure pour professionnels"
    />

    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OlysWeb — Solutions web sur mesure pour professionnels"
    />
    <meta
      name="twitter:description"
      content="Sites web, applications métier, plateformes, e-commerce et automatisations conçus sur mesure pour les professionnels."
    />
    <meta name="twitter:image" content="https://www.OlysWeb.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="OlysWeb — Solutions web sur mesure pour professionnels"
    />

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="OlysWeb" />

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Structured data - organisation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "OlysWeb",
        "url": "https://www.OlysWeb.com/",
        "logo": "https://www.OlysWeb.com/logo.png",
        "description": "Agence de développement web spécialisée dans la conception de solutions web sur mesure pour les professionnels.",
        "sameAs": ["https://www.linkedin.com/company/OlysWeb/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
